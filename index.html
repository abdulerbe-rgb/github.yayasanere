<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERBE AI Agent</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#18324e;font:15px system-ui}aside{position:fixed;inset:0 auto 0 0;width:230px;background:#12345a;color:white;padding:24px 14px}aside h2{margin:0 10px 4px}aside p{margin:0 10px 24px;color:#b9d2eb;font-size:12px}nav{display:grid;gap:7px}nav button{background:transparent;color:#e4effb;text-align:left}nav button.on,nav button:hover{background:#ffffff20}button{border:0;border-radius:8px;padding:10px 13px;background:#1769aa;color:white;font-weight:650;cursor:pointer}button.alt{background:#e7f0f8;color:#12345a}button.del{background:#fff0f0;color:#b42318}main{margin-left:230px;padding:26px;max-width:1450px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#718096}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:white;border:1px solid #e3eaf2;border-radius:13px;padding:17px;margin-top:15px}.num{font-size:30px;font-weight:800}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:grid;gap:5px}.field label{font-weight:650;font-size:13px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #dce5ef;border-radius:8px;font:inherit}.field textarea{min-height:100px}.wide{grid-column:1/-1}table{width:100%;border-collapse:collapse;min-width:550px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e8edf3}th{font-size:12px;color:#718096}.scroll{overflow:auto}.notice{background:#fff8e8;padding:12px;border:1px solid #f2dfad;border-radius:9px;margin-top:14px}.hidden{display:none}.output{min-height:220px}.pill{font-size:12px;background:#eaf4fc;color:#1769aa;border-radius:30px;padding:4px 8px}@media(max-width:780px){aside{position:static;width:auto;padding:14px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{margin:0;padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><aside><h2>eRBe <span style="color:#77c8ff">AI</span></h2><p>Foundation Management System</p><nav id="nav"></nav></aside><main><div class="head"><div><h1 id="title">Dashboard</h1><div class="muted">Pusat kendali operasional Yayasan ERBE</div></div><button class="alt" onclick="backup()">Backup JSON ↓</button></div><div id="view"></div></main>
<script>
const pages=[['home','Dashboard'],['vol','Relawan'],['act','Kegiatan'],['don','Donatur'],['report','Laporan Donatur'],['social','Media Sosial']];
const keys={vol:'erbe_vol',act:'erbe_act',don:'erbe_don',social:'erbe_social'};
const read=k=>JSON.parse(localStorage.getItem(keys[k])||'[]'),write=(k,v)=>localStorage.setItem(keys[k],JSON.stringify(v));let page='home';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function go(p){page=p;draw()}function draw(){ $('nav').innerHTML=pages.map(([p,n])=>'<button class="'+(p===page?'on':'')+'" onclick="go(\''+p+'\')">'+n+'</button>').join('');$('title').textContent=pages.find(x=>x[0]===page)[1];let v=$('view');
if(page==='home'){v.innerHTML='<div class="cards">'+[['Relawan',read('vol').length],['Kegiatan',read('act').length],['Donatur',read('don').length],['Draf konten',read('social').length]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="num">'+x[1]+'</div></div>').join('')+'</div><div class="card"><h3>Alur kerja</h3><p>Catat kegiatan → lengkapi bukti dan capaian → buat laporan → buat konten → verifikasi → persetujuan admin → kirim/publikasi → arsip.</p><div class="notice">Privasi: lindungi identitas anak dan penerima manfaat. Pastikan izin dokumentasi dan publikasi. AI hanya membuat draf; semua angka, anggaran, dan klaim dampak harus diverifikasi.</div></div>';return}
if(page==='vol'){v.innerHTML=form('vol','Data Relawan',[['name','Nama'],['phone','WhatsApp'],['email','Email'],['skills','Keahlian'],['availability','Ketersediaan']])+table('vol',['name','phone','skills','availability']);return}
if(page==='act'){v.innerHTML=form('act','Data Kegiatan',[['name','Nama kegiatan'],['program','Program'],['date','Tanggal','date'],['place','Lokasi'],['count','Jumlah penerima manfaat'],['summary','Ringkasan kegiatan','textarea']])+table('act',['name','program','date','place','count']);return}
if(page==='don'){v.innerHTML=form('don','Data Donatur',[['name','Nama donatur/organisasi'],['contact','Kontak'],['email','Email'],['interest','Minat dukungan'],['notes','Catatan','textarea']])+table('don',['name','contact','email','interest']);return}
if(page==='report'){v.innerHTML='<div class="card"><h3>Generator draf laporan</h3>'+selectAct('rep')+'<button onclick="report()">Buat draf laporan</button><div class="field" style="margin-top:12px"><label>Draf laporan</label><textarea id="out" class="output"></textarea></div><button class="alt" onclick="copy('out')">Salin</button></div>';return}
if(page==='social'){v.innerHTML='<div class="card"><h3>Generator konten sosial media</h3>'+selectAct('soc')+'<div class="field"><label>Platform</label><select id="platform"><option>Instagram</option><option>Facebook</option><option>LinkedIn</option></select></div><button onclick="caption()">Buat caption</button><div class="field" style="margin-top:12px"><label>Draf caption</label><textarea id="caption" class="output"></textarea></div><button onclick="saveCaption()">Simpan draf</button> <button class="alt" onclick="copy('caption')">Salin</button><h3>Arsip draf</h3>'+read('social').map(x=>'<p><span class="pill">'+esc(x.platform)+'</span> '+esc(x.text)+'</p>').join('')+'</div>'}}
function form(k,title,fields){return '<div class="card"><h3>'+title+'</h3><form onsubmit="add(event,\''+k+'\')"><div class="form">'+fields.map(f=>'<div class="field"><label>'+f[1]+'</label>'+(f[2]==='textarea'?'<textarea name="'+f[0]+'" required></textarea>':'<input name="'+f[0]+'" '+(f[2]==='date'?'type="date"':'')+' required>')+'</div>').join('')+'</div><p><button>Simpan</button></p></form></div>'}
function table(k,cols){let a=read(k);return '<div class="card"><h3>Database</h3><div class="scroll"><table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'<th>Aksi</th></tr>'+a.map((r,i)=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'<td><button class="del" onclick="removeRow(\''+k+'\','+i+')">Hapus</button></td></tr>').join('')+'</table></div>'+(a.length?'':'<p class="muted">Belum ada data.</p>')+'</div>'}
function add(e,k){e.preventDefault();write(k,[...read(k),Object.fromEntries(new FormData(e.target))]);draw()}function removeRow(k,i){if(confirm('Hapus data ini?')){let a=read(k);a.splice(i,1);write(k,a);draw()}}
function selectAct(id){return '<div class="field"><label>Pilih kegiatan</label><select id="'+id+'">'+read('act').map((a,i)=>'<option value="'+i+'">'+esc(a.name)+' · '+esc(a.date)+'</option>').join('')+'</select></div>'}
function report(){let a=read('act')[+$('rep').value];if(!a)return alert('Masukkan data kegiatan terlebih dahulu.');$('out').value='LAPORAN KEGIATAN YAYASAN ERBE\n\nNama: '+a.name+'\nProgram: '+a.program+'\nTanggal: '+a.date+'\nLokasi: '+a.place+'\nPenerima manfaat: '+a.count+'\n\nRINGKASAN\n'+a.summary+'\n\nOUTPUT & CAPAIAN\n[Isi capaian terukur dan bukti verifikasi.]\n\nOUTCOME / PERUBAHAN AWAL\n[Isi perubahan yang teramati dan metode pengukuran.]\n\nREALISASI ANGGARAN\n[Isi hanya dari catatan keuangan terverifikasi.]\n\nDOKUMENTASI\n[Masukkan tautan foto/video yang telah mendapat izin.]\n\nTANTANGAN DAN TINDAK LANJUT\n[Isi kendala, pembelajaran, dan rencana.]\n\nTerima kasih kepada donatur dan mitra Yayasan ERBE.\n\nSTATUS: DRAF — wajib diverifikasi sebelum dikirim.'}
function caption(){let a=read('act')[+$('soc').value];if(!a)return alert('Masukkan data kegiatan terlebih dahulu.');$('caption').value='Setiap kegiatan punya cerita dan proses yang berarti. ❤️\n\nYayasan ERBE melaksanakan '+a.name+' sebagai bagian dari program '+a.program+'. Kegiatan berlangsung di '+a.place+' pada '+a.date+'. Kegiatan ini menjangkau '+a.count+' penerima manfaat.\n\n'+a.summary+'\n\nTerima kasih kepada relawan, mitra, dan donatur yang terus mendukung langkah baik ini.\n\n#YayasanERBE #KolaborasiKebaikan #BerbagiManfaat'}
function saveCaption(){write('social',[{platform:$('platform').value,text:$('caption').value,date:new Date().toLocaleDateString('id-ID')},...read('social')]);alert('Draf tersimpan. Publikasi tetap memerlukan persetujuan admin.');draw()}
function copy(id){$(id).select();document.execCommand('copy');alert('Teks disalin.')}function backup(){let data={relawan:read('vol'),kegiatan:read('act'),donatur:read('don'),konten:read('social')};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='backup-erbe.json';a.click();URL.revokeObjectURL(a.href)}draw();
</script></main></body></html>
