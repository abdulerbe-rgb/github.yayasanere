<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERBE AI Agent</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#18324e;font:15px system-ui}aside{position:fixed;inset:0 auto 0 0;width:230px;background:#12345a;color:white;padding:24px 14px}aside h2{margin:0 10px 4px}aside p{margin:0 10px 24px;color:#b9d2eb;font-size:12px}nav{display:grid;gap:7px}nav button{background:transparent;color:#e4effb;text-align:left}nav button.on,nav button:hover{background:#ffffff20}button{border:0;border-radius:8px;padding:10px 13px;background:#1769aa;color:white;font-weight:650;cursor:pointer}button.alt{background:#e7f0f8;color:#12345a}button.del{background:#fff0f0;color:#b42318}main{margin-left:230px;padding:26px;max-width:1450px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#718096}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:white;border:1px solid #e3eaf2;border-radius:13px;padding:17px;margin-top:15px}.num{font-size:30px;font-weight:800}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-weight:650;font-size:13px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #dce5ef;border-radius:8px;font:inherit}.field textarea{min-height:100px}.wide{grid-column:1/-1}table{width:100%;border-collapse:collapse;min-width:550px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e8edf3;vertical-align:top}th{font-size:12px;color:#718096}.scroll{overflow:auto}.notice{background:#fff8e8;padding:12px;border:1px solid #f2dfad;border-radius:9px;margin-top:14px}.output{min-height:220px}.pill{font-size:12px;background:#eaf4fc;color:#1769aa;border-radius:30px;padding:4px 8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.template-note{white-space:pre-wrap;background:#f7f9fc;padding:12px;border-radius:8px;font-size:13px;max-height:300px;overflow:auto}@media(max-width:780px){aside{position:static;width:auto;padding:14px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{margin:0;padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head>
<body><aside><h2>eRBe <span style="color:#77c8ff">AI</span></h2><p>Foundation Management System</p><nav id="nav"></nav></aside>
<main><div class="head"><div><h1 id="title">Dashboard</h1><div class="muted">Pusat kendali operasional Yayasan ERBE</div></div><button class="alt" onclick="backup()">Backup JSON</button></div><div id="view"></div></main>
<script>
const pages=[['home','Dashboard'],['vol','Relawan'],['act','Kegiatan'],['don','Donatur'],['report','Laporan Donatur'],['social','Media Sosial']];
const keys={vol:'erbe_vol',act:'erbe_act',don:'erbe_don',social:'erbe_social'};
const read=k=>JSON.parse(localStorage.getItem(keys[k])||'[]'),write=(k,v)=>localStorage.setItem(keys[k],JSON.stringify(v));let page='home';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(p){page=p;draw()}
function draw(){ $('nav').innerHTML=pages.map(([p,n])=>`<button class="${p===page?'on':''}" onclick="go('${p}')">${n}</button>`).join('');$('title').textContent=pages.find(x=>x[0]===page)[1];let v=$('view');
if(page==='home'){v.innerHTML='<div class="cards">'+[['Relawan',read('vol').length],['Kegiatan',read('act').length],['Donatur',read('don').length],['Draf konten',read('social').length]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('')+'</div><div class="card"><h3>Alur kerja</h3><p>Catat kegiatan → lengkapi bukti → siapkan draf → verifikasi fakta, angka, anggaran, dan izin → minta persetujuan → kirim/publikasikan.</p><div class="notice">Privasi: lindungi identitas anak dan penerima manfaat. Gunakan foto/video hanya dengan izin yang sesuai. AI hanya membantu membuat draf; verifikasi semua klaim sebelum digunakan.</div></div>';return}
if(page==='vol'){v.innerHTML=form('vol','Data Relawan',[['name','Nama'],['phone','WhatsApp'],['email','Email'],['skills','Keahlian'],['availability','Ketersediaan']])+table('vol',['name','phone','skills','availability']);return}
if(page==='act'){v.innerHTML=form('act','Data Kegiatan',[['name','Nama kegiatan'],['program','Program'],['date','Tanggal','date'],['place','Lokasi'],['count','Jumlah penerima manfaat'],['summary','Ringkasan kegiatan','textarea']])+table('act',['name','program','date','place','count']);return}
if(page==='don'){v.innerHTML=form('don','Data Donatur',[['name','Nama donatur/organisasi'],['contact','Kontak'],['email','Email'],['interest','Minat dukungan'],['notes','Catatan','textarea']])+table('don',['name','contact','email','interest']);return}
if(page==='report'){v.innerHTML=`<div class="card"><h3>Generator draf laporan</h3>${selectAct('rep')}<button onclick="report()">Buat draf laporan</button><div class="field"><label>Draf laporan</label><textarea id="out" class="output"></textarea></div><button class="alt" onclick="copy('out')">Salin</button></div>`;return}
if(page==='social'){v.innerHTML=socialPanel();return}}
function form(k,title,fields){return `<div class="card"><h3>${title}</h3><form onsubmit="add(event,'${k}')"><div class="form">${fields.map(f=>`<div class="field"><label>${f[1]}</label>${f[2]==='textarea'?`<textarea name="${f[0]}" required></textarea>`:`<input name="${f[0]}" ${f[2]==='date'?'type="date"':''} required>`}</div>`).join('')}</div><button>Simpan</button></form></div>`}
function table(k,cols){let a=read(k);return `<div class="card"><h3>Database</h3><div class="scroll"><table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th>Aksi</th></tr>${a.map((r,i)=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}<td><button class="del" onclick="removeRow('${k}',${i})">Hapus</button></td></tr>`).join('')}</table></div>${a.length?'':'<p class="muted">Belum ada data.</p>'}</div>`}
function add(e,k){e.preventDefault();write(k,[...read(k),Object.fromEntries(new FormData(e.target))]);draw()}
function removeRow(k,i){if(confirm('Hapus data ini?')){let a=read(k);a.splice(i,1);write(k,a);draw()}}
function selectAct(id){return `<div class="field"><label>Pilih kegiatan (opsional untuk prompt)</label><select id="${id}"><option value="">Pilih kegiatan</option>${read('act').map((a,i)=>`<option value="${i}">${esc(a.name)} · ${esc(a.date)}</option>`).join('')}</select></div>`}
function report(){let a=read('act')[+$('rep').value];if(!a)return alert('Pilih atau masukkan data kegiatan terlebih dahulu.');$('out').value=`LAPORAN KEGIATAN YAYASAN ERBE\n\nNama: ${a.name}\nProgram: ${a.program}\nTanggal: ${a.date}\nLokasi: ${a.place}\nPenerima manfaat: ${a.count}\n\nRINGKASAN\n${a.summary}\n\nOUTPUT & CAPAIAN\n[Isi capaian terukur dan bukti terverifikasi.]\n\nOUTCOME / PERUBAHAN AWAL\n[Isi perubahan yang diamati, bukti, dan metode pengukuran.]\n\nREALISASI ANGGARAN\n[Isi hanya berdasarkan catatan keuangan terverifikasi.]\n\nDOKUMENTASI & IZIN\n[Cantumkan dokumentasi yang telah mendapat izin.]\n\nTANTANGAN, PEMBELAJARAN, DAN TINDAK LANJUT\n[PERLU DILENGKAPI]\n\nSTATUS: DRAF — verifikasi sebelum dibagikan.`}
const setupPrompt=`Kamu berperan sebagai Social Media Strategist untuk akun Instagram Yayasan ERBE (@yayasan_erbe). Gunakan bahasa Indonesia yang hangat, empatik, profesional, akrab, dan memanusiakan manusia. Sapaan dapat memakai “Kakak”, “Sobat ERBE”, atau “Ayah/Bunda”; sebut anak binaan “adik-adik” jika sesuai konteks.\n\nKONTEKS BRAND (berdasarkan bahan dari tim; verifikasi sebelum publikasi): Yayasan ERBE (Education, Religion, Bee, Entertainment) disebut berdiri sejak 2016 di Rawadas, Pondok Kopi, Duren Sawit, Jakarta Timur. Fokus yang disampaikan: Rumah Belajar, pendampingan pendidikan dan pengajian, edukasi PHBS, serta pemberdayaan masyarakat. Audiens: calon relawan, donatur/mitra, komunitas, dan masyarakat umum.\n\nATURAN WAJIB: Jangan mengarang fakta, angka, lokasi, tanggal, testimoni, hasil, dampak, rekening, atau tautan. Jika data belum ada, tulis [PERLU DILENGKAPI] atau tanyakan. Bedakan output, outcome, dan impact; klaim harus punya bukti. Jaga privasi dan martabat anak serta keluarga; hindari eksploitasi kesedihan. Jangan menyarankan pemakaian foto, video, atau testimoni tanpa izin yang sesuai. Semua hasil adalah DRAF, bukan materi terbit; perlu verifikasi dan persetujuan petugas berwenang. Jangan mengirim atau memublikasikan konten.\n\nBerikan hasil yang ringkas, mudah dipakai, dan sesuai format yang diminta. Sertakan data yang perlu diverifikasi bila relevan.`;
const templates={reel:`Buat skrip Instagram Reels untuk Yayasan ERBE berdasarkan brief berikut. Berikan 3 opsi hook untuk 3 detik pertama, naskah voice-over dengan estimasi durasi, serta arahan visual per klip yang menjaga privasi dan martabat subjek. Jangan menambahkan fakta di luar brief.\nTopik/momen: {topic}\nAudiens: {audience}\nDurasi: {duration}\nCTA: {cta}\nCatatan/fakta yang tersedia: {details}\nTandai informasi kosong [PERLU DILENGKAPI]. Akhiri dengan pengingat verifikasi izin dokumentasi. Status: DRAF.`,carousel:`Buat konsep Instagram Carousel Yayasan ERBE dari brief berikut. Susun {slides} slide; tiap slide maksimal 2–3 kalimat pendek. Slide 1 harus menarik tanpa mengeksploitasi kesedihan; slide terakhir berisi CTA yang jelas. Beri judul/teks per slide dan saran visual etis. Klaim dampak hanya jika didukung bukti; jangan mengarang.\nTopik: {topic}\nTujuan/CTA: {cta}\nFakta/bukti yang tersedia: {details}\nTandai data kosong [PERLU DILENGKAPI]. Status: DRAF.`,caption:`Buat 2 variasi caption Instagram Yayasan ERBE. Baris pertama hangat dan mengundang pembaca melanjutkan. Tata informasi agar mudah dibaca, gunakan CTA hanya sesuai brief, dan tambahkan tagar relevan seperlunya. Jangan membuat fakta, jadwal, rekening, atau tautan.\nKegiatan/program: {topic}\nInfo teknis terverifikasi: {details}\nTujuan caption/CTA: {cta}\nSapaan/nuansa (opsional): {audience}\nGunakan [PERLU DILENGKAPI] untuk data kosong. Status: DRAF.`,ideas:`Buat 10 ide konten Instagram Yayasan ERBE untuk satu bulan berdasarkan brief ini. Campurkan Reels, Carousel, dan Foto Kegiatan. Untuk setiap ide berikan pilar, format, judul/hook, tujuan, dan bahan/fakta yang perlu disiapkan. Usahakan proporsi pilar sesuai brief; jangan mengarang jadwal, capaian, atau cerita penerima manfaat.\nFokus bulan: {topic}\nProporsi/pilar konten: {details}\nAudiens: {audience}\nCTA utama: {cta}\nTandai fakta yang perlu dilengkapi. Status: DRAF.`};
function socialPanel(){return `<div class="card"><h3>Prompt Instagram Yayasan ERBE</h3><p class="muted">Pilih jenis konten, isi brief, lalu salin prompt untuk digunakan di Claude.ai atau alat AI pilihan. Generator ini menyusun prompt saja—tidak mengirim konten ke layanan AI.</p><div class="notice">Jangan masukkan data pribadi atau sensitif anak, keluarga, relawan, maupun donatur. Tinjau izin dokumentasi, verifikasi fakta, dan minta persetujuan sebelum publikasi.</div><div class="field"><label>Jenis konten</label><select id="kind" onchange="showBrief()"><option value="reel">Skrip Reels</option><option value="carousel">Carousel</option><option value="caption">Caption</option><option value="ideas">Ide bulanan</option></select></div><div id="brief"></div>${selectAct('socialAct')}<div class="actions"><button onclick="makePrompt()">Susun prompt</button><button class="alt" onclick="copy('setup')">Salin prompt setup Claude.ai</button></div><div class="field"><label>Prompt setup (tempel sekali pada chat baru)</label><textarea id="setup" class="template-note">${esc(setupPrompt)}</textarea></div><div class="field"><label>Prompt operasional</label><textarea id="prompt" class="output" placeholder="Isi brief lalu pilih Susun prompt"></textarea></div><div class="actions"><button class="alt" onclick="copy('prompt')">Salin prompt</button><button onclick="saveSocial()">Simpan draf</button></div><h3>Arsip draf konten</h3>${read('social').map((x,i)=>`<div class="template-note"><span class="pill">${esc(x.kind||x.platform||'Instagram')}</span> ${esc(x.date||'')}\n${esc(x.text)}</div>`).join('')||'<p class="muted">Belum ada draf tersimpan.</p>'}</div>`}
function showBrief(){let kind=$('kind').value;let fields=[['topic','Topik / fokus','text'],['audience','Audiens utama','text'],['details','Fakta, bahan, bukti, atau info teknis terverifikasi','textarea'],['cta','Tujuan / CTA','text']];if(kind==='reel')fields.splice(2,0,['duration','Durasi target','text']);if(kind==='carousel')fields.splice(2,0,['slides','Jumlah slide','number']);if(kind==='ideas')fields.splice(2,0,['details','Pilar dan proporsi konten','textarea']);$('brief').innerHTML='<div class="form">'+fields.map(([id,label,type])=>`<div class="field ${type==='textarea'?'wide':''}"><label>${label}</label>${type==='textarea'?`<textarea id="b_${id}" placeholder="Isi seperlunya; jangan masukkan data pribadi."></textarea>`:`<input id="b_${id}" type="${type}" placeholder="[PERLU DILENGKAPI]">`}</div>`).join('')+'</div>'}
function makePrompt(){let kind=$('kind').value,field=id=>$('b_'+id)?.value.trim()||'[PERLU DILENGKAPI]';let activity=read('act')[+$('socialAct').value];let topic=field('topic');if(activity){topic=topic==='[PERLU DILENGKAPI]'?activity.name:topic;let info=`Nama kegiatan: ${activity.name}; Program: ${activity.program}; Tanggal: ${activity.date}; Lokasi: ${activity.place}; Jumlah penerima manfaat: ${activity.count}; Ringkasan: ${activity.summary}.`;let current=field('details');fieldSetter('details',current==='[PERLU DILENGKAPI]'?info:current+'\n'+info)}$('prompt').value=templates[kind].replaceAll('{topic}',topic).replaceAll('{audience}',field('audience')).replaceAll('{duration}',field('duration')).replaceAll('{slides}',field('slides')).replaceAll('{details}',field('details')).replaceAll('{cta}',field('cta'))}
function fieldSetter(id,value){let el=$('b_'+id);if(el)el.value=value}
function saveSocial(){let text=$('prompt').value.trim();if(!text)return alert('Susun prompt terlebih dahulu.');write('social',[{kind:$('kind').value,text,date:new Date().toLocaleDateString('id-ID')},...read('social')]);alert('Draf prompt tersimpan secara lokal.');draw()}
function copy(id){let el=$(id);el.select();document.execCommand('copy');alert('Teks disalin.')}
function backup(){let data={relawan:read('vol'),kegiatan:read('act'),donatur:read('don'),konten:read('social')};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='backup-erbe.json';a.click();URL.revokeObjectURL(a.href)}
draw();if(page==='social')showBrief();
</script></body></html>
